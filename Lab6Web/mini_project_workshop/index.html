<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pendaftaran Workshop</title>
 <link rel="stylesheet" href="style.css">
 <script src="script.js" defer></script>
</head>
<body>
 <main class="wadah">
  <header>
   <h1>Pendaftaran Workshop Web</h1>
   <p>Isi formulir berikut untuk mengamankan kursi Anda.</p>
  </header>

  <div class="grid">
   <form id="formWorkshop" novalidate>
    <div class="field">
     <label for="nama">Nama lengkap</label>
     <input id="nama" name="nama" type="text" autocomplete="name" placeholder="Minimal 3 karakter">
     <small class="error" id="errNama" aria-live="polite"></small>
    </div>

    <div class="field">
     <label for="email">Email</label>
     <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@contoh.com">
     <small class="error" id="errEmail" aria-live="polite"></small>
    </div>

    <div class="field">
     <label for="sesi">Pilihan sesi</label>
     <select id="sesi" name="sesi">
      <option value="">-- Pilih sesi --</option>
      <option value="HTML &amp; CSS Dasar">Sesi 1 — HTML &amp; CSS Dasar (09.00)</option>
      <option value="JavaScript DOM">Sesi 2 — JavaScript DOM (11.00)</option>
      <option value="Git &amp; GitHub">Sesi 3 — Git &amp; GitHub (13.00)</option>
     </select>
     <small class="info" id="infoSesi"></small>
     <small class="error" id="errSesi" aria-live="polite"></small>
    </div>

    <div class="field">
     <label for="motivasi">Motivasi mengikuti workshop</label>
     <textarea id="motivasi" name="motivasi" rows="4" maxlength="150" placeholder="Opsional, maksimal 150 karakter"></textarea>
     <small class="info">Jumlah karakter: <span id="hitungMotivasi">0</span>/150</small>
    </div>

    <div class="aksi">
     <button type="submit" class="utama">Daftar</button>
     <button type="reset" id="tombolReset" class="sekunder">Reset</button>
    </div>
    <p id="pesanUtama" class="pesan" aria-live="polite"></p>
   </form>

   <aside class="ringkasan" aria-live="polite">
    <h2>Ringkasan Input</h2>
    <dl>
     <dt>Nama</dt><dd id="rNama">-</dd>
     <dt>Email</dt><dd id="rEmail">-</dd>
     <dt>Sesi</dt><dd id="rSesi">-</dd>
     <dt>Motivasi</dt><dd id="rMotivasi">-</dd>
    </dl>
   </aside>
  </div>
 </main>
</body>
</html>
